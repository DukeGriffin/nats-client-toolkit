# =============================================================================
# nats-jetstream.conf -- starter NATS server config with JetStream enabled.
#
# This is SERVER-SIDE / operator configuration (how the broker is set up), NOT
# something a NATS client sends over the wire. Edit the values, then run either:
#     nats-server -c nats-jetstream.conf
#     .\start-nats-jetstream.ps1 -ConfigFile .\nats-jetstream.conf
#
# Full reference: https://docs.nats.io/running-a-nats-service/configuration
# JetStream:      https://docs.nats.io/running-a-nats-service/configuration/resource_management
# Use forward slashes in Windows paths (backslashes must be escaped in this format).
# =============================================================================

# --- Listeners ---
port: 4222                 # client connections (NATS protocol)
http_port: 8222            # HTTP monitoring endpoints: /varz /jsz /connz /healthz ...
server_name: nats-dev      # shows up in INFO and monitoring

# --- Core limits (optional; shown at their defaults) ---
# max_payload: 1MB         # largest single message the server accepts (default 1MB)
# max_connections: 64K

# --- JetStream: the persistence layer ---
# Enabling this block is what turns JetStream on (equivalent to the -js flag).
jetstream {
  store_dir: "C:/nats/data"   # where file-storage streams are kept (created if missing)

  # Resource ceilings for the whole server (bytes; K / M / G / T suffixes):
  max_memory_store: 1G        # total size cap across all memory-storage streams
  max_file_store: 10G         # total size cap across all file-storage streams

  # --- Less common options (uncomment as needed) ---
  # domain: "hub"             # JetStream domain -- isolates this instance (leaf nodes /
  #                           # edge). Changes the client API prefix to $JS.hub.API.
  # sync_interval: "2m"       # how often the file store fsyncs; "always" = safest/slowest
  # max_outstanding_catchup: 64M
}

# --- Logging (optional) ---
# logtime: true
# debug: false
# trace: false               # log EVERY protocol message -- very verbose, great for
#                            # confirming exact wire bytes against the toolkit docs.

# =============================================================================
# NOTE on per-account JetStream limits:
# In multi-account/multi-tenant setups the max streams/consumers/memory/storage a
# given account may use are set in an `accounts { ... }` block (or in the account's
# JWT for decentralized auth), NOT here and NOT by the client. The block above sets
# the server-wide totals. For single-account local dev, the above is all you need.
# =============================================================================
